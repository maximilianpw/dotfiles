name: vev-startup
root: ~/Local/Vev Platform Services

windows:
  - infra:
      layout: even-horizontal
      panes:
        - docker:
            root: ~/Local/Vev Platform Services/vev-docker-compose
            commands:
              - docker compose up --build
        - dashboard:
            root: ~/Local/Vev Platform Services/vev-docker-compose/submodules/vev-dashboard
            commands:
              - npm run start
  - mcp:
      root: ~/Local/Vev Platform Services/vev-iq-mcp
      panes:
        - npm run start
