# Everforest-inspired palette (lightened)
# red: #f09395  orange: #f0ac8a  yellow: #e5cb93
# green: #b8d09a  aqua: #9ad4a8  blue: #96cdc6
# purple: #e2adc8  grey: #909d8f

format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$python\
$rust\
$golang\
$nix_shell\
$aws\
$kubernetes\
$docker_context
$character"""

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold #b8d09a)"
error_symbol = "[❯](bold #f09395)"
vimcmd_symbol = "[❮](bold #96cdc6)"
vimcmd_replace_one_symbol = "[❮](bold #f0ac8a)"
vimcmd_replace_symbol = "[❮](bold #f0ac8a)"
vimcmd_visual_symbol = "[❮](bold #e2adc8)"

[directory]
style = "bold #b8d09a"
truncation_length = 3
truncate_to_repo = false
read_only = " 󰌾"
read_only_style = "#f09395"

[git_branch]
symbol = ""
style = "#96cdc6"
format = "[$symbol$branch]($style)"

[git_status]
style = "#e2adc8"
format = "( [$all_status$ahead_behind]($style))"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↑${ahead_count}↓${behind_count}"
conflicted = "=${count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[cmd_duration]
style = "#909d8f"
format = "[  $duration]($style)"
min_time = 2_000

[python]
symbol = " "
style = "#e5cb93"
format = "[ $symbol$virtualenv]($style)"

[rust]
symbol = " "
style = "#f0ac8a"
format = "[ $symbol$version]($style)"

[golang]
symbol = " "
style = "#9ad4a8"
format = "[ $symbol$version]($style)"

[nix_shell]
symbol = " "
style = "#96cdc6"
format = "[ $symbol$state($name)]($style)"

[aws]
symbol = " "
style = "#f0ac8a"
format = "[ $symbol$profile($region)]($style)"

[kubernetes]
symbol = "󱃾 "
style = "#96cdc6"
format = "[ $symbol$context($namespace)]($style)"
disabled = true

[docker_context]
symbol = " "
style = "#96cdc6"
format = "[$symbol$context]($style)"

[nodejs]
disabled = true

[package]
disabled = true
