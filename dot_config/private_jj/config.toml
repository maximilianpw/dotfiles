"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "Maximilian PINDER-WHITE"
email = "mpinderwhite@proton.me"

[signing]
backend = "gpg"
behavior = "own"

[ui]
default-command = "log"
editor = "nvim"

[aliases]
b = ["bookmark"]
c = ["commit"]
d = ["desc"]
di = ["diff"]
e = ["edit"]
f = ["git", "fetch"]
l = ["log", "-r", "trunk()..@"]
n = ["new"]
p = ["git", "push"]
s = ["status"]
# Move the closest bookmark to the current commit. This is useful when
# working on a named branch, creating a bunch of commits, and then needing
# to update the bookmark before pushing.
tug = ["bookmark", "move", "--from", "closest_bookmark(@-)", "--to", "@-"]
# Rebase the current branch onto the trunk.
retrunk = ["rebase", "-d", "trunk()"]
# Tidy up the current branch, removing commits from dead branches.
tidy = ["abandon", "mine() & ~bookmarks() & ~::@ & ~trunk() & mutable()"]
# Tidy up all commits that have been merged into trunk.
tidy-all = ["abandon", "~bookmarks() & ~::@ & ~trunk() & mutable()"]
a = ["absorb"]
el = ["evolog", "-p"]
nx = ["next"]
pv = ["prev"]
sp = ["split"]

[fix.tools.prettier]
command = ["prettier", "--write", "$path"]
patterns = ["glob:**/*.{ts,tsx,js,json,css}"]

[fix.tools.rustfmt]
command = ["rustfmt", "$path"]
patterns = ["glob:**/*.rs"]

[git]
abandon-unreachable-commits = false

[remotes.origin]
auto-track-bookmarks = "glob:main"

[templates]
git_push_bookmark = '"maximilianpw/push-" ++ change_id.short()'
private-commits = "description(glob:'wip:*') | description(glob:'private:*')"

[revset-aliases]
"closest_bookmark(to)" = "heads(::to & bookmarks())"
"fork_history(to, from)" = "fork_point(to | from)..@"

[template-aliases]
"format_timestamp(timestamp)" = "timestamp.ago()"
