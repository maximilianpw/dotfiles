# Shell
shell bash -l -c nu

# Font
font_family JetBrainsMono Nerd Font
font_size 14.5
font_features JetBrainsMonoNF-Regular +zero +cv14
disable_ligatures always
text_composition_strategy platform
modify_font cell_height 105%
modify_font baseline 0

# Appearance
background_opacity 0.95
background_blur 20
hide_window_decorations no
mouse_hide_wait 0
undercurl_style thin-sparse

# Performance
repaint_delay 6
input_delay 1
sync_to_monitor yes

# Theme (Horizon-inspired)
foreground #c0c0c0
background #1c1e26
cursor #e95678
selection_foreground #1c1e26
selection_background #d5d8da

# Normal colors
color0  #16161c
color1  #e95678
color2  #29d398
color3  #fab795
color4  #26bbd9
color5  #ee64ac
color6  #59e3e3
color7  #d5d8da

# Bright colors
color8  #5b5858
color9  #ec6a88
color10 #3fdaa4
color11 #fbc3a7
color12 #3fc6de
color13 #f075b7
color14 #6be6e6
color15 #d5d8da

# Keybindings (alt-based, matching Ghostty config)
clear_all_shortcuts yes

# Clipboard
map alt+c        copy_to_clipboard
map alt+v        paste_from_clipboard
map alt+shift+c  copy_to_clipboard
map alt+shift+v  paste_from_clipboard

# Font size
map alt+equal    change_font_size all +1.0
map alt+minus    change_font_size all -1.0
map alt+0        change_font_size all 0

# Window management
map alt+q        quit
map alt+shift+,  load_config_file
map alt+k        clear_terminal scrollback active
map alt+n        new_os_window
map alt+w        close_window
map alt+shift+w  close_os_window

# Tabs
map alt+t              new_tab
map alt+shift+[        previous_tab
map alt+shift+]        next_tab

# Splits (layouts)
enabled_layouts splits,stack
map alt+d        launch --location=vsplit --cwd=current
map alt+shift+d  launch --location=hsplit --cwd=current
map alt+]        next_window
map alt+[        previous_window

# macOS
macos_option_as_alt left
macos_colorspace displayp3
